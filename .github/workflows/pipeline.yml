name: Multi-Page Content Pipeline & Hourly Scheduler

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:     # Allows manual trigger or control from UI
    inputs:
      action:
        description: 'Pipeline Action'
        required: true
        default: 'run'
        type: choice
        options:
          - 'run'
          - 'dry_run'
          - 'health_check'
          - 'ingest'
      channel:
        description: 'Target Channel ID (or all)'
        required: false
        default: 'all'
      source_url:
        description: 'Specific Facebook Page URL to ingest'
        required: false
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: facebook-publisher
  cancel-in-progress: false

jobs:
  run-pipeline:
    name: Execute Automated Auto-Post Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (OpenCV & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 fonts-dejavu-core fonts-noto-core fonts-deva libraqm0

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Install Browser Fallback
        run: python -m playwright install --with-deps chromium

      - name: Reuse Text Detection Models
        uses: actions/cache@v4
        with:
          path: ~/.EasyOCR/model
          key: easyocr-models-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Check Caption, Cleanup and Layout Regressions
        run: |
          python -m unittest discover -s tests
          node tests/test_github_save.js

      - name: Capture Current Publication Baseline
        run: python sync_pipeline_state.py capture-baseline --directory .pipeline-sync

      - name: Execute Multi-Channel Post Pipeline
        id: pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FB_TOKEN_DAILY_NETFLIX: ${{ secrets.FB_TOKEN_DAILY_NETFLIX }}
          FB_TOKEN_MUSIC_STORE: ${{ secrets.FB_TOKEN_MUSIC_STORE }}
          FB_TOKEN_ANISHA: ${{ secrets.FB_TOKEN_ANISHA }}
          FB_TOKEN_DAILY_HOLLYWOOD: ${{ secrets.FB_TOKEN_DAILY_HOLLYWOOD }}
          FB_TOKEN_OCEANS_SECRET: ${{ secrets.FB_TOKEN_OCEANS_SECRET }}
          FB_TOKEN_NEPAL_SPEAKS: ${{ secrets.FB_TOKEN_NEPAL_SPEAKS }}
          FB_TOKEN_US_ARMY_FANS_AI: ${{ secrets.FB_TOKEN_US_ARMY_FANS_AI }}
          FB_TOKEN_LIFE_IN_ARMY_BOOTS: ${{ secrets.FB_TOKEN_LIFE_IN_ARMY_BOOTS }}
          FB_TOKEN_GUARDIANS_OF_LIBERTY: ${{ secrets.FB_TOKEN_GUARDIANS_OF_LIBERTY }}
          FB_TOKEN_DEFAULT: ${{ secrets.FB_TOKEN_DEFAULT }}
          FEED_SOURCE_URL: ${{ github.event.inputs.source_url }}
        run: |
          ACTION="${{ github.event.inputs.action }}"
          CHANNEL="${{ github.event.inputs.channel }}"
          [ -z "$ACTION" ] && ACTION="run"
          [ -z "$CHANNEL" ] && CHANNEL="all"
          if [ "$ACTION" = "true" ]; then ACTION="run"; fi
          if [ "$CHANNEL" = "true" ]; then CHANNEL="all"; fi

          if [ "$ACTION" = "ingest" ]; then
            python build_rich_feed_cache.py "$FEED_SOURCE_URL" 15
          else
            python -u main.py "$ACTION" "$CHANNEL"
          fi

      - name: Save Recoverable Publication Evidence
        if: ${{ always() && steps.pipeline.outcome != 'skipped' && steps.pipeline.outcome != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: publisher-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            state.json
            quality_report.json
            posters_cache.json
            feed_cache.json
            source_cache.json
            publication_journal.json
          if-no-files-found: warn
          retention-days: 30

      - name: Merge and Push Confirmed Publication State
        if: ${{ always() && steps.pipeline.outcome != 'skipped' && steps.pipeline.outcome != '' }}
        run: python sync_pipeline_state.py push --directory .pipeline-sync

